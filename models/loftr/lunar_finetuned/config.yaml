data:
  crop_size: 512
  min_overlap_pct: 20.0
  processed_root: ./data/processed/pairs
  raw_root: ./data/raw
  test_split: 0.1
  train_split: 0.75
  val_split: 0.15
sensors:
  priority:
  - OHRC_LROC
  - OHRC_TMC2
  - OHRC_IIRS
training:
  accumulate_grad_batches: 2
  batch_size: 2
  checkpoint_dir: ./models/loftr/lunar_finetuned
  coarse_loss_weight: 1.0
  fine_loss_weight: 0.25
  image_size: 640
  learning_rate: 0.0001
  mixed_precision: false
  num_epochs: 5
  optimizer: AdamW
  pretrained_weights: outdoor
  save_top_k: 2
  weight_decay: 0.0001
