# Configuration for Lunar LoFTR Fine-Tuning (SIH26166)
training:
  learning_rate: 0.0001
  weight_decay: 0.0001
  batch_size: 2
  accumulate_grad_batches: 2
  num_epochs: 5
  image_size: 640
  coarse_loss_weight: 1.0
  fine_loss_weight: 0.25
  optimizer: "AdamW"
  mixed_precision: false
  save_top_k: 2
  checkpoint_dir: "./models/loftr/lunar_finetuned"
  pretrained_weights: "outdoor"

data:
  raw_root: "./data/raw"
  processed_root: "./data/processed/pairs"
  min_overlap_pct: 20.0
  train_split: 0.75
  val_split: 0.15
  test_split: 0.10
  crop_size: 512

sensors:
  priority:
    - "OHRC_LROC"
    - "OHRC_TMC2"
    - "OHRC_IIRS"
